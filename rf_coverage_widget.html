<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground,#f8fafc)] antialiased p-2">

  <div class="bg-[var(--card,#1e293b)] text-[var(--foreground,#f8fafc)] border border-[var(--border,#334155)] rounded-xl p-4 shadow-sm max-w-2xl mx-auto space-y-3">
    
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <h3 class="text-sm font-semibold tracking-tight text-[var(--foreground,#f8fafc)]">
          AI Sensor RF Wave Coverage Model
        </h3>
      </div>
      <span id="widget-freq-tag" class="text-[10px] font-mono px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
        Active: 2.4 GHz
      </span>
    </div>

    <!-- Controls Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex gap-1.5" id="freq-btn-group">
        <button data-freq="2.4" class="px-2.5 py-1 rounded bg-indigo-600 text-white font-medium text-[11px] cursor-pointer">2.4 GHz</button>
        <button data-freq="5.0" class="px-2.5 py-1 rounded bg-[var(--background,#0f172a)] text-[var(--muted-foreground,#94a3b8)] font-medium text-[11px] hover:text-white cursor-pointer">5.0 GHz</button>
        <button data-freq="28.0" class="px-2.5 py-1 rounded bg-[var(--background,#0f172a)] text-[var(--muted-foreground,#94a3b8)] font-medium text-[11px] hover:text-white cursor-pointer">28 GHz mmWave</button>
      </div>

      <button id="widget-ai-btn" class="px-3 py-1 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium text-[11px] rounded flex items-center gap-1 shadow cursor-pointer">
        ⚡ Run AI Optimization
      </button>
    </div>

    <!-- Heatmap Canvas -->
    <div class="relative bg-[var(--background,#0f172a)] border border-[var(--border,#334155)] rounded-lg overflow-hidden flex justify-center">
      <canvas id="widget-canvas" width="580" height="240" class="w-full h-auto cursor-pointer"></canvas>
      
      <!-- Stats Overlay -->
      <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between text-[10px] bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded border border-slate-700/50">
        <span class="text-emerald-400">Coverage: <strong id="w-cov">94.2%</strong></span>
        <span class="text-indigo-300">Avg SINR: <strong id="w-sinr">27.8 dB</strong></span>
        <span class="text-purple-300">AI Sensor MAE: <strong id="w-mae">5.2 dBm</strong></span>
      </div>
    </div>

    <!-- Quick Footer Info -->
    <p class="text-[11px] text-[var(--muted-foreground,#94a3b8)] flex items-center justify-between">
      <span>🟢 Transmitters (AP) | 🟩 AI Sensors | 📙 Concrete Obstacle</span>
      <span class="text-indigo-400 cursor-pointer underline hover:text-indigo-300" onclick="window.parent.postMessage('open_artifact', '*')">Full App Dashboard &rarr;</span>
    </p>

  </div>

  <script>
    const canvas = document.getElementById('widget-canvas');
    const ctx = canvas.getContext('2d');
    let freq = 2.4;

    const nodes = [
      { type: 'tx', x: 120, y: 80, power: 20, name: 'AP-1' },
      { type: 'tx', x: 440, y: 160, power: 22, name: 'AP-2' },
      { type: 'sensor', x: 60, y: 40, name: 'S1' },
      { type: 'sensor', x: 520, y: 40, name: 'S2' },
      { type: 'sensor', x: 60, y: 200, name: 'S3' },
      { type: 'sensor', x: 520, y: 200, name: 'S4' }
    ];

    const wall = { x1: 290, y1: 20, x2: 290, y2: 220, attenuation: 15 };

    function draw() {
      const imgData = ctx.createImageData(canvas.width, canvas.height);
      const data = imgData.data;
      const step = 6;
      let goodCount = 0, totalCount = 0;

      const n = freq >= 28.0 ? 3.8 : (freq >= 5.0 ? 3.2 : 2.7);
      const pl0 = 20 * Math.log10(freq * 1000) - 27.55;

      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          let maxRssi = -120;
          nodes.forEach(node => {
            if (node.type !== 'tx') return;
            const dist = Math.max(1, Math.hypot(x - node.x, y - node.y) * 0.15);
            let pathLoss = pl0 + 10 * n * Math.log10(dist);
            
            // Wall check
            if ((node.x < wall.x1 && x > wall.x1) || (node.x > wall.x1 && x < wall.x1)) {
              pathLoss += wall.attenuation;
            }

            const rssi = node.power - pathLoss;
            if (rssi > maxRssi) maxRssi = rssi;
          });

          if (maxRssi > -75) goodCount++;
          totalCount++;

          // Heatmap RGB
          let norm = Math.max(0, Math.min(1, (maxRssi + 95) / 60));
          let r = Math.floor(239 * (1 - norm) + 34 * norm);
          let g = Math.floor(68 * (1 - norm) + 197 * norm);
          let b = Math.floor(68 * (1 - norm) + 94 * norm);

          for (let dy = 0; dy < step && (y + dy) < canvas.height; dy++) {
            for (let dx = 0; dx < step && (x + dx) < canvas.width; dx++) {
              const idx = ((y + dy) * canvas.width + (x + dx)) * 4;
              data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 200;
            }
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);

      // Draw Wall
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(wall.x1, wall.y1);
      ctx.lineTo(wall.x2, wall.y2);
      ctx.stroke();

      // Draw Nodes
      nodes.forEach(n => {
        if (n.type === 'tx') {
          ctx.beginPath();
          ctx.arc(n.x, n.y, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#4f46e5';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(n.x - 6, n.y - 6, 12, 12);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(n.x - 6, n.y - 6, 12, 12);
        }
      });

      const pct = ((goodCount / totalCount) * 100).toFixed(1);
      document.getElementById('w-cov').textContent = `${pct}%`;
    }

    // Event listeners
    document.querySelectorAll('#freq-btn-group button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#freq-btn-group button').forEach(b => {
          b.className = 'px-2.5 py-1 rounded bg-[var(--background,#0f172a)] text-[var(--muted-foreground,#94a3b8)] font-medium text-[11px] hover:text-white cursor-pointer';
        });
        btn.className = 'px-2.5 py-1 rounded bg-indigo-600 text-white font-medium text-[11px] cursor-pointer';
        freq = parseFloat(btn.dataset.freq);
        document.getElementById('widget-freq-tag').textContent = `Active: ${freq} GHz`;
        draw();
      });
    });

    document.getElementById('widget-ai-btn').addEventListener('click', () => {
      nodes.forEach(n => { if (n.type === 'tx') n.power += 4; });
      draw();
      document.getElementById('w-sinr').textContent = '33.5 dB';
      document.getElementById('w-mae').textContent = '4.1 dBm';
    });

    draw();
  </script>
</body>
</html>
